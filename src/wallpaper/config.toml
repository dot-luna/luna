# Available configuration options for Luna's wallpaper.
# Reference for the user-managed TOML file; the app does not load or copy this file automatically.
# Location: $XDG_CONFIG_HOME/luna/wallpaper.toml; XDG_CONFIG_HOME defaults to ~/.config.
# LUNA_WALLPAPER_CONFIG=/path/to/wallpaper.toml overrides this location.
# Missing or unsupported option values use their defaults; unknown options are ignored.
# Settings and manual edits use the same file.
# Config is read once at startup. Restart the wallpaper app after editing it.

[wallpaper]
# Use an absolute media path; "" (the default) selects only the background color.
# Media type is detected from its contents, so no type option is needed.
source = "/path/to/wallpaper.jpg"

# Values:
# fill: preserve aspect ratio and crop to cover the output.
# fit: preserve aspect ratio and show the whole image, leaving space where needed.
# stretch: fill the output without preserving aspect ratio.
# center (default): keep the original size, centered; crop anything outside the output.
# tile: repeat images at their original size; videos use center instead.
fit = "center"

# Values: a hex color in #RRGGBB format; defaults to #000000 and fills uncovered areas.
background_color = "#000000"

[playback]
# Values: true suspends animated/video playback while its output is disabled or
# asleep and resumes it when active; false keeps playback running. Default: true.
pause_when_output_inactive = true

[transition]
# Values: none switches immediately; fade (default) blends images. Videos switch immediately.
type = "fade"

# Values: integer milliseconds from 0 to 2147483647; default 200. Zero switches immediately.
# Ignored when type = "none".
duration_ms = 200

# Currently only the first available monitor uses the global settings.
# Per-monitor overrides are reserved for future support and are ignored for now.
# They use compositor connector names and accept the same values as global options.
# [outputs."eDP-1".wallpaper]
# source = "/path/to/laptop-wallpaper.png"
# fit = "fit"
# background_color = "#101010"
#
# [outputs."DP-1".wallpaper]
# source = "/path/to/live-wallpaper.webm"
# fit = "fill"
#
# [outputs."DP-1".playback]
# pause_when_output_inactive = true
