# Sample for the planned wallpaper configuration; the renderer does not read it yet.
# Planned user file: $XDG_CONFIG_HOME/luna/wallpaper.toml, or ~/.config/luna/wallpaper.toml.
# Select a different file with LUNA_WALLPAPER_CONFIG=/path/to/wallpaper.toml.
# Luna supplies defaults for omitted options. Settings and manual edits use the same file.

[wallpaper]
# Use an absolute media path, or a path relative to the user configuration file.
source = "/path/to/wallpaper.jpg"
# auto detects the media type; explicit choices: image, animated, video.
# Examples: static PNG/JPEG, animated GIF/WebP, and MP4/WebM video.
# Actual format and codec support will depend on the playback backend.
type = "auto"
# fill crops to cover; fit keeps the whole image; stretch ignores aspect ratio.
# center uses the original size; tile repeats the image.
fit = "fill"
# Visible around media that does not cover its output.
background_color = "#000000"
# Empty means all connected outputs. Otherwise, list connector names such as eDP-1.
outputs = []

[playback]
# These options apply to animated images and videos; audio applies only to videos.
loop = true
muted = true
paused = false
# Suspend playback while its output is disabled or asleep.
pause_when_output_inactive = true
# auto prefers hardware decoding when available; software forces CPU decoding.
decoding = "auto"

[transition]
# none switches immediately; fade blends between wallpapers.
type = "fade"
duration_ms = 200

# Optional overrides use compositor output names and inherit omitted global values.
# Uncomment an example to give that output different media or display settings.
# [outputs."eDP-1".wallpaper]
# source = "/path/to/laptop-wallpaper.png"
# type = "image"
# fit = "fit"
# background_color = "#101010"
#
# [outputs."DP-1".wallpaper]
# source = "/path/to/live-wallpaper.webm"
# type = "video"
# fit = "fill"
#
# [outputs."DP-1".playback]
# loop = true
# muted = true
# paused = false
